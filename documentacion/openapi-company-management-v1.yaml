components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken
  parameters:
    PublicAccountId:
      name: publicAccountId
      in: path
      required: true
      schema:
        type: string
        pattern: ^acc_[A-Za-z0-9]+$
    PublicCompanyId:
      name: publicCompanyId
      in: path
      required: true
      schema:
        type: string
        pattern: ^com_[A-Za-z0-9]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 255
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    After:
      name: after
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
        default: name
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    Fields:
      name: fields
      in: query
      schema:
        type: string
    PublicBranchId:
      name: publicBranchId
      in: path
      required: true
      schema:
        type: string
        pattern: ^brn_[A-Za-z0-9]+$
  headers:
    ETag:
      description: Versión de representación del recurso.
      schema:
        type: string
    CacheControl:
      description: Política de caché privada.
      schema:
        type: string
  schemas:
    CrossBranchAuthorizationRequest:
      type: object
      required:
      - sourceBranchId
      - targetBranchIds
      - resourceTypes
      properties:
        sourceBranchId:
          type: string
        targetBranchIds:
          type: array
          minItems: 1
          items:
            type: string
        resourceTypes:
          type: array
          minItems: 1
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
    CrossBranchAuthorization:
      type: object
      properties:
        authorizationId:
          type: string
        companyId:
          type: string
        sourceBranchId:
          type: string
        targetBranchIds:
          type: array
          items:
            type: string
        resourceTypes:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
          - EXPIRED
    TemporaryFile:
      type: object
      properties:
        fileId:
          type: string
        companyId:
          type: string
        fileName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - AVAILABLE
          - EXPIRED
          - DELETED
        expiresAt:
          type: string
          format: date-time
    CompanyPatchRequest:
      type: object
      minProperties: 1
      properties:
        legalName:
          type: string
          maxLength: 240
        tradeName:
          type: string
          maxLength: 240
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
    Assignment:
      type: object
      properties:
        assignmentId:
          type: string
        membershipId:
          type: string
        branchId:
          type: string
        roleIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
    WebhookSubscriptionRequest:
      type: object
      required:
      - endpointUrl
      - eventTypes
      - eventVersion
      properties:
        endpointUrl:
          type: string
          format: uri
        branchIds:
          type: array
          items:
            type: string
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
        eventVersion:
          type: string
          default: '1.0'
    WebhookSubscriptionPatch:
      type: object
      minProperties: 1
      properties:
        endpointUrl:
          type: string
          format: uri
        branchIds:
          type: array
          items:
            type: string
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
        eventVersion:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
    WebhookSubscription:
      type: object
      properties:
        subscriptionId:
          type: string
        companyId:
          type: string
        endpointUrl:
          type: string
          format: uri
        branchIds:
          type: array
          items:
            type: string
        eventTypes:
