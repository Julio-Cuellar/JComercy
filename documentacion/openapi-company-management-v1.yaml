    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    patch:
      tags:
      - Companies
      summary: Actualizar configuración operativa
      operationId: updateCompanyOperationalSettings
      x-required-permission: companies.operational_settings.update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Configuración actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/companies/{publicCompanyId}/localization:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    patch:
      tags:
      - Companies
      summary: Actualizar localización de empresa
      operationId: updateCompanyLocalization
      x-required-permission: companies.localization.update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - timeZone
              properties:
                timeZone:
                  type: string
                locale:
                  type: string
      responses:
        '200':
          description: Localización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
