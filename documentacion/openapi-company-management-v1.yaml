    CompanyAccess:
      type: object
      description: Una empresa a la que la cuenta puede entrar.
      required: [publicCompanyId, relationship]
      properties:
        publicCompanyId:
          type: string
          example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        tradeName:
          type: string
          description: Nombre comercial de la empresa.
          example: Abarrotes La Esquina
        status:
          type: string
          description: Estado de la empresa.
          example: ACTIVE
        relationship:
          type: string
          enum: [OWNER, MEMBER]
          description: '`OWNER` si la cuenta es dueña de la empresa; `MEMBER` si entra por una membresía activa.'
        roles:
          type: array
          description: Roles de la membresía. Vacío para quien es dueña.
          items:
            type: string
          example: [STAFF]
        passwordProtected:
          type: boolean
          description: >-
            `true` si la persona le puso contraseña a su acceso a esta empresa: entrar la pide. Es una marca de la
            persona, no de la empresa; otra persona de la misma empresa puede no tener contraseña.
          example: false
    CompanySession:
      type: object
      description: >-
        Token de una empresa. Nombra solo esa empresa, con las sucursales y los permisos que la persona tiene en ella.
      required: [accessToken, tokenType, expiresIn, publicCompanyId]
      properties:
        accessToken:
          type: string
          description: Token JWT de la empresa.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Segundos que dura el token.
          example: 3600
        publicCompanyId:
          type: string
          example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    EnterCompanyRequest:
      type: object
      description: Lo que se envía al entrar a una empresa. El cuerpo es opcional si el acceso no tiene contraseña.
      properties:
        password:
          type: string
          format: password
          description: Contraseña que la persona le puso a su acceso a esta empresa.
          example: contraseña-de-ejemplo
    SetCompanyPasswordRequest:
      type: object
      description: Lo que se envía para poner o cambiar la contraseña del acceso a una empresa.
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: La contraseña actual. Solo se pide al cambiar una que ya existe.
          example: contraseña-actual-de-ejemplo
        newPassword:
          type: string
          format: password
          minLength: 8
          description: La contraseña nueva. Debe ser distinta a la de la cuenta.
          example: contraseña-nueva-de-ejemplo
    RemoveCompanyPasswordRequest:
      type: object
      description: Lo que se envía para quitar la contraseña del acceso a una empresa.
      properties:
        accountPassword:
          type: string
          format: password
          description: La contraseña de la cuenta. Es la salida si se olvidó la de la empresa.
          example: contraseña-de-cuenta-de-ejemplo
    AccountSuspensionRequest:
      type: object
      description: >-
        Cuerpo que acepta hoy la suspensión de cuenta. Difiere de `SuspensionRequest`, que anticipa `reasonCode` y
        `confirmation`.
      properties:
        reason:
          type: string
          description: Motivo de la suspensión. Si se omite, el evento registra "Suspensión administrativa".
          example: Pago pendiente
