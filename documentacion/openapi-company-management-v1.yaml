        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    patch:
      tags:
      - Companies
      summary: Actualizar perfil de empresa
      operationId: updateCompanyProfile
      x-required-permission: companies.profile.update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legalName:
                  type: string
                  maxLength: 240
                tradeName:
                  type: string
                  maxLength: 240
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/companies/{publicCompanyId}/tax-profile:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    patch:
      tags:
      - Companies
      summary: Actualizar perfil fiscal
      operationId: updateCompanyTaxProfile
      x-required-permission: companies.tax_profile.update
