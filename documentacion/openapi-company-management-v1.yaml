          application/json:
            schema:
              type: object
              properties:
                rfc:
                  type: string
                  maxLength: 13
      responses:
        '200':
          description: Perfil fiscal actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/v1/companies/{publicCompanyId}/contact:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
