components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token de cuenta o token de empresa, según la ruta. Las rutas bajo `/accounts/{publicAccountId}` piden el de la
        cuenta; las rutas bajo `/companies/{publicCompanyId}`, el de esa empresa. Ver «Cómo se autentica» en la
        descripción del contrato.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken
  parameters:
    PublicAccountId:
      name: publicAccountId
      in: path
      required: true
      schema:
        type: string
        pattern: ^acc_[A-Za-z0-9]+$
    PublicCompanyId:
      name: publicCompanyId
      in: path
      required: true
      schema:
        type: string
        pattern: ^com_[A-Za-z0-9]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
