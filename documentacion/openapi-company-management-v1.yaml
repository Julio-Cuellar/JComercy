              type: integer
  responses:
    BadRequest:
      description: >-
        Solicitud inválida. El campo `code` indica la causa: `MALFORMED_REQUEST` (JSON ilegible o formato
        incorrecto), `VALIDATION_ERROR` (faltan datos o no son válidos) o `MISSING_HEADER` (falta un encabezado, o
        `Idempotency-Key` viene vacío).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Autenticación requerida o inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        El token es válido pero no da acceso: es de otra cuenta, no tiene acceso a esa empresa, es de la clase
        equivocada para la ruta (el de una empresa en una ruta de cuenta, o el de cuenta o el de otra empresa en una
        ruta de empresa) o faltan permisos. `code` es `INSUFFICIENT_PERMISSIONS`, no se modifica nada y el mensaje dice
        qué hacer. Una empresa que no existe responde igual a quien no es miembro, para no revelar si existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso fuera del alcance visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        Conflicto de idempotencia, concurrencia o estado. Con `code` `IDEMPOTENCY_KEY_ALREADY_USED`, la operación
        ya se procesó con esa `Idempotency-Key`: hay que consultar el recurso para ver el resultado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Reglas de negocio incumplidas
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: El cuerpo no es JSON. Hay que enviarlo con `Content-Type` `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Límite de consumo excedido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AccessLocked:
      description: >-
        El acceso a la empresa está bloqueado por demasiados intentos fallidos (`COMPANY_ACCESS_LOCKED`). `Retry-After`
        indica los segundos que faltan para poder volver a intentarlo.
      headers:
        Retry-After:
          description: Segundos que faltan para poder volver a intentarlo.
          schema:
            type: integer
            example: 900
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependencia temporalmente no disponible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
