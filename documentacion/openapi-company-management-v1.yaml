    post:
      tags:
      - Companies
      summary: Reactivar empresa
      operationId: reactivateCompany
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Empresa reactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
      x-required-permission: companies.reactivate
  /api/v1/companies/{publicCompanyId}/deletion-requests:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    post:
      tags:
      - Companies
      summary: Solicitar baja lógica de empresa
      operationId: requestCompanyDeletion
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Solicitud aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReference'
        '401':
