    AssignmentRequest:
      type: object
      required:
      - branchId
      - roleIds
      properties:
        branchId:
          type: string
        roleIds:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          default: ACTIVE
    AssignmentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        page:
          type: object
          properties:
            limit:
              type: integer
            nextCursor:
              type: string
              nullable: true
    OperationalContext:
      type: object
      properties:
        contextId:
          type: string
        companyId:
          type: string
        branchId:
          type: string
        expiresAt:
          type: string
          format: date-time
        permissionsVersion:
          type: integer
    OperationalContextPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationalContext'
    ConfigurationStatus:
      type: object
      required:
      - status
      - completedSections
      - pendingSections
      properties:
        status:
          type: string
          enum:
          - CONFIGURING
          - READY_FOR_ACTIVATION
        completedSections:
          type: array
          items:
            type: string
        pendingSections:
          type: array
          items:
            type: string
        correlationId:
          type: string
    LifecycleResponse:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
        changedAt:
          type: string
          format: date-time
        correlationId:
          type: string
    SuspensionRequest:
      type: object
      required:
      - reasonCode
      - confirmation
      properties:
        reasonCode:
          type: string
        confirmation:
          type: boolean
          const: true
        expectedImpactAccepted:
          type: boolean
    DeletionRequest:
      type: object
      required:
      - confirmation
      properties:
        confirmation:
          type: boolean
          const: true
        reasonCode:
          type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      - correlationId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlationId:
          type: string
        instance:
          type: string
          format: uri-reference
        invalidParams:
          type: array
          items:
            type: object
            additionalProperties: true
    AccountRegistrationRequest:
      type: object
      required:
      - name
      - owner
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          example: Cuenta OpenAPI Test
        owner:
          $ref: '#/components/schemas/OwnerPerson'
    OwnerPerson:
      type: object
      required:
      - firstName
      - lastName
      - birthDate
      - rfc
      - phoneNumber
      - email
      - password
      - state
      - address
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Julio
        lastName:
          type: string
          minLength: 1
          maxLength: 160
          example: Pérez López
        birthDate:
          type: string
          format: date
          example: '1985-04-12'
        rfc:
          type: string
          minLength: 12
          maxLength: 13
          example: PELJ850412ABC
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 30
          example: '5512345678'
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        state:
          type: string
          minLength: 1
          maxLength: 100
          example: Ciudad de México
        address:
          type: string
          minLength: 1
          maxLength: 500
          example: Av. Reforma 100
    AccountRegistrationResponse:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountReference'
        ownerMembership:
          $ref: '#/components/schemas/MembershipReference'
        company:
          $ref: '#/components/schemas/CompanyReference'
        headOffice:
          $ref: '#/components/schemas/BranchReference'
        nextActions:
          type: array
          items:
            type: string
        correlationId:
          type: string
    Account:
      type: object
      properties:
        publicAccountId:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - CONFIGURING
          - ACTIVE
          - SUSPENDED
          - DEACTIVATED
        owner:
          $ref: '#/components/schemas/OwnerPerson'
        timeZone:
          type: string
        locale:
          type: string
        version:
          type: integer
          minimum: 0
          example: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        timeZone:
          type: string
        locale:
          type: string
        contactPreferences:
          type: object
          properties:
            email:
              type: boolean
            webSocket:
              type: boolean
    AccountReference:
      type: object
      properties:
        publicAccountId:
          type: string
        status:
          type: string
    MembershipReference:
      type: object
      properties:
        membershipId:
          type: string
        role:
          type: string
          enum:
          - ACCOUNT_OWNER
        status:
          type: string
    CompanyInput:
      type: object
      required:
      - legalName
      - rfc
      - taxRegime
      - incorporationDate
      - phone
      - email
      - fiscalAddress
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 240
        tradeName:
          type: string
          maxLength: 240
        rfc:
          type: string
          minLength: 12
          maxLength: 13
        taxRegime:
          type: string
          example: '601'
        incorporationDate:
          type: string
          format: date
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        logoUrl:
          type: string
          format: uri
        fiscalAddress:
          $ref: '#/components/schemas/FiscalAddress'
    FiscalAddress:
      type: object
      required:
      - calle
      - numeroExterior
      - colonia
      - codigoPostal
      - municipioAlcaldia
      - estado
      - pais
      properties:
        calle:
          type: string
        numeroExterior:
          type: string
        numeroInterior:
          type: string
        colonia:
          type: string
        codigoPostal:
          type: string
        municipioAlcaldia:
          type: string
        estado:
          type: string
        pais:
          type: string
    CompanyReference:
      type: object
      properties:
        publicCompanyId:
          type: string
        status:
          type: string
          enum:
          - CONFIGURING
          - READY_FOR_ACTIVATION
          - ACTIVE
          - SUSPENDED
          - DELETION_REQUESTED
          - DELETED
    Company:
      allOf:
      - $ref: '#/components/schemas/CompanyReference'
      - type: object
        properties:
          legalName:
            type: string
          tradeName:
            type: string
          rfc:
            type: string
          taxRegime:
            type: string
          incorporationDate:
            type: string
            format: date
          phone:
            type: string
          email:
            type: string
            format: email
          website:
            type: string
          logoUrl:
            type: string
          fiscalAddress:
            $ref: '#/components/schemas/FiscalAddress'
          preferencesJson:
            type: string
          version:
            type: integer
            minimum: 1
    CreateCompanyRequest:
      $ref: '#/components/schemas/CompanyInput'
    CreateCompanyResponse:
      type: object
      properties:
        publicCompanyId:
          type: string
        companyStatus:
          type: string
          enum:
          - CONFIGURING
        headOffice:
          $ref: '#/components/schemas/BranchReference'
        ownerMembership:
          $ref: '#/components/schemas/MembershipReference'
        nextActions:
          type: array
          items:
            type: string
    CompanyPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        page:
          type: object
          properties:
            limit:
              type: integer
            nextCursor:
              type: string
              nullable: true
        meta:
          type: object
          properties:
            count:
              type: integer
    BranchInput:
      type: object
      required:
      - code
      - name
      - domicilio
      - phoneNumber
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        code:
          type: string
          maxLength: 50
        type:
          type: string
          enum: [MATRIZ, SUCURSAL, BODEGA, PUNTO_VENTA]
          description: La primera sucursal de cada empresa debe ser MATRIZ; posteriormente solo se permiten sucursales no matriz.
          default: SUCURSAL
        domicilio:
          $ref: '#/components/schemas/FiscalAddress'
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: string
          format: email
        rfc:
          type: string
          maxLength: 13
        fiscalName:
          type: string
          maxLength: 255
        fiscalPostalCode:
          type: string
          maxLength: 20
        centroCostoId:
          type: string
        almacenId:
          type: string
        listaPreciosId:
          type: string
        serieFacturacion:
          type: string
          maxLength: 32
        folioActual:
          type: integer
          format: int64
          minimum: 0
        moneda:
          type: string
          minLength: 3
          maxLength: 3
          default: MXN
        responsableId:
          type: string
        fechaApertura:
          type: string
          format: date
        fechaCierre:
          type: string
          format: date
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
    BranchPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        code:
          type: string
          maxLength: 50
        domicilio:
          $ref: '#/components/schemas/FiscalAddress'
    CreateBranchRequest:
      allOf:
      - $ref: '#/components/schemas/BranchInput'
      - type: object
        properties:
          coverage:
            type: object
            properties:
              requested:
                type: string
                enum:
                - PLAN_INCLUDED
                - ADD_ON
    BranchReference:
      type: object
      properties:
        publicBranchId:
          type: string
        status:
          type: string
          enum:
          - CONFIGURING
          - READY_FOR_ACTIVATION
          - PENDING_PLAN
          - ACTIVE
          - SUSPENDED
        type:
          type: string
          enum: [MATRIZ, SUCURSAL, BODEGA, PUNTO_VENTA]
    Branch:
      allOf:
      - $ref: '#/components/schemas/BranchReference'
      - type: object
        properties:
          publicCompanyId:
            type: string
          name:
            type: string
          code:
            type: string
          coverage:
            type: string
            enum:
            - PLAN_INCLUDED
            - ADD_ON
            - AWAITING_BILLING
          operable:
            type: boolean
          timeZone:
            type: string
          domicilio:
            $ref: '#/components/schemas/FiscalAddress'
          phoneNumber:
            type: string
          email:
            type: string
            format: email
          rfc:
            type: string
          fiscalName:
            type: string
          fiscalPostalCode:
            type: string
          centroCostoId:
            type: string
          almacenId:
            type: string
          listaPreciosId:
            type: string
          serieFacturacion:
            type: string
          folioActual:
            type: integer
            format: int64
          moneda:
            type: string
          responsableId:
            type: string
          fechaApertura:
            type: string
            format: date
          fechaCierre:
            type: string
            format: date
          version:
            type: integer
            minimum: 1
    BranchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        page:
          type: object
          properties:
            limit:
              type: integer
            nextCursor:
              type: string
              nullable: true
        meta:
          type: object
          properties:
            count:
              type: integer
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Autenticación requerida o inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El actor no tiene permisos suficientes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso fuera del alcance visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto de idempotencia, concurrencia o estado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Reglas de negocio incumplidas
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Límite de consumo excedido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependencia temporalmente no disponible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
