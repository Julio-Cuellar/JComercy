      operationId: listBranches
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Status'
      - name: isHeadOffice
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Direction'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Sucursales visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-permission: branches.read
    post:
      tags:
      - Branches
      summary: Crear sucursal
      operationId: createBranch
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Sucursal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
      x-required-permission: branches.create
  /api/v1/companies/{publicCompanyId}/profile:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
