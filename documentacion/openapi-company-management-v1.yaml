      summary: Completar configuración de empresa
      operationId: completeCompanyConfiguration
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Configuración validada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-permission: companies.configure
  /api/v1/companies/{publicCompanyId}/activation:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
