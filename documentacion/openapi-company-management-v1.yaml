openapi: 3.1.0
info:
  title: JComercy Company Management API
  version: 1.0.0
  description: |-
    Contrato formal inicial del módulo company_management. Describe las rutas que el módulo ya expone y otras anticipadas que todavía no existen en el código.

    ## Cómo se autentica

    Hay dos clases de token, y cada ruta exige la suya:

    - **Token de cuenta.** Lo entregan el inicio de sesión (`/auth/login`) y su renovación (`/auth/refresh`). Dice quién eres y nada más: no nombra empresas, sucursales ni permisos. Sirve para las rutas bajo `/accounts/{publicAccountId}`, entre ellas «Tus empresas» y la entrada a una empresa.
    - **Token de empresa.** Lo entrega `enterCompany` al entrar a una empresa. Nombra solo esa empresa, con las sucursales y los permisos que la persona tiene en ella, y nunca los de otra. Dura una hora y renovar la sesión no lo renueva: hay que volver a entrar. Sirve para las rutas bajo `/companies/{publicCompanyId}` de **esa** empresa.

    Una ruta de cuenta rechaza el token de una empresa, y una ruta de empresa rechaza el token de cuenta y el de otra empresa. Todos esos rechazos son `403` con `code` `INSUFFICIENT_PERMISSIONS`, y el mensaje dice qué hacer. Si la persona le puso contraseña a su acceso a una empresa, `enterCompany` la pide.

    Que la persona siga perteneciendo a la empresa y lo que su rol le permite se comprueban en cada petición contra la base de datos, no contra el token.
servers:
- url: http://localhost:8080
  description: Entorno local H2
- url: https://api.jcomercy.example.com
  description: Producción (placeholder)
- url: https://sandbox-api.jcomercy.example.com
  description: Sandbox (placeholder)
tags:
- name: Auth
- name: Accounts
- name: Companies
- name: Branches
- name: Operations
- name: Webhooks
- name: Billing
- name: Files
- name: Audit
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Iniciar sesión con correo electrónico y obtener JWT
      description: >-
        Entrega el **token de cuenta**: dice quién eres, sin empresas, sucursales ni permisos. Para trabajar dentro de
        una empresa hay que entrar a ella con `enterCompany`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: owner@example.com
                password:
                  type: string
                  format: password
                  example: OwnerPassword123!
      responses:
        '200':
          description: Token de cuenta emitido
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, tokenType, expiresIn]
                properties:
                  accessToken:
                    type: string
                    description: Token de cuenta (JWT). No nombra empresas ni permisos.
                  refreshToken:
                    type: string
                    description: Token opaco de renovación; se rota en cada uso.
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: integer
                    format: int64
                    example: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar JWT y rotar refresh token
      description: >-
        Entrega un nuevo token de cuenta y rota el token de renovación. No renueva el token de una empresa: hay que
        volver a entrar a ella con `enterCompany`.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Token de cuenta renovado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Refresh token inválido, expirado o revocado }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/v1/auth/password-recovery:
    post:
      tags: [Auth]
      summary: Solicitar recuperación de contraseña
      operationId: requestPasswordRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202': { description: Solicitud aceptada sin revelar si el correo existe }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/v1/auth/password-recovery/confirm:
    post:
      tags: [Auth]
      summary: Confirmar recuperación de contraseña
      operationId: confirmPasswordRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 8, writeOnly: true }
      responses:
        '204': { description: Contraseña actualizada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Token inválido o expirado }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/v1/accounts/registration:
    post:
      tags:
      - Accounts
      summary: Registrar cuenta administrativa
      operationId: registerAccount
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegistrationRequest'
      responses:
        '201':
          description: Cuenta administrativa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-required-permission: accounts.register
  /api/v1/accounts/{publicAccountId}:
    parameters:
    - $ref: '#/components/parameters/PublicAccountId'
    - name: publicAccountId
      in: path
      required: true
      description: Identificador público de la cuenta administrativa
      schema:
        type: string
        example: acc_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    get:
      tags:
      - Accounts
      summary: Consultar cuenta administrativa
      operationId: getAccount
      parameters:
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Cuenta consultada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '304':
          description: El recurso no cambió
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-permission: accounts.read
    patch:
      tags:
      - Accounts
      summary: Actualizar datos y preferencias de cuenta
      operationId: updateAccount
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          description: Cuenta actualizada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
      x-required-permission: accounts.update
  /api/v1/accounts/{publicAccountId}/suspension:
    parameters:
    - $ref: '#/components/parameters/PublicAccountId'
    - name: publicAccountId
      in: path
      required: true
      description: Identificador público de la cuenta administrativa
      schema:
        type: string
        example: acc_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    post:
      tags:
      - Accounts
      summary: Suspender cuenta administrativa
      operationId: suspendAccount
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSuspensionRequest'
      responses:
        '200':
          description: Cuenta suspendida
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
      x-required-permission: accounts.suspend
  /api/v1/accounts/{publicAccountId}/company-accesses:
    parameters:
    - $ref: '#/components/parameters/PublicAccountId'
    get:
      tags:
      - Accounts
      summary: Consultar las empresas a las que la cuenta puede entrar
      description: >-
        Las empresas que la cuenta posee y aquellas donde tiene una membresía activa. Alimenta la pantalla
        «Tus empresas». Solo la propia cuenta puede consultarla.
      operationId: listCompanyAccesses
      responses:
        '200':
          description: Empresas a las que la cuenta puede entrar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-permission: accounts.company_accesses.read
  /api/v1/accounts/{publicAccountId}/company-accesses/{targetCompanyId}/session:
    parameters:
    - $ref: '#/components/parameters/PublicAccountId'
    - name: targetCompanyId
      in: path
      required: true
      description: Identificador público de la empresa a la que se quiere entrar
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    post:
      tags:
      - Accounts
      summary: Entrar a una empresa
      description: >-
        Entrega el token de esa empresa. Ese token nombra solo esa empresa, con las sucursales y los permisos que la
        persona tiene en ella, y no los de ninguna otra. Entrar a una empresa sin acceso responde igual que entrar a
        una que no existe. Si la persona le puso contraseña a su acceso (`passwordProtected` en «Tus empresas»), hay
        que enviarla en `password`; cinco contraseñas equivocadas bloquean ese acceso quince minutos.
      operationId: enterCompany
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterCompanyRequest'
      responses:
        '200':
          description: Token de la empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Sin acceso a la empresa (`INSUFFICIENT_PERMISSIONS`), o falta o es incorrecta la contraseña del acceso
            (`COMPANY_PASSWORD_REQUIRED`, `COMPANY_PASSWORD_INVALID`). El mensaje de contraseña incorrecta dice cuántos
            intentos quedan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/AccessLocked'
      x-required-permission: accounts.company_accesses.enter
  /api/v1/accounts/{publicAccountId}/company-accesses/{targetCompanyId}/password:
    parameters:
    - $ref: '#/components/parameters/PublicAccountId'
    - name: targetCompanyId
      in: path
      required: true
      description: Identificador público de la empresa cuyo acceso se protege
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    put:
      tags:
      - Accounts
      summary: Poner o cambiar la contraseña de una empresa
      description: >-
        Cada persona puede ponerle, si quiere, una contraseña propia a su acceso a una empresa. Cambiarla exige la
        actual (`currentPassword`); ponerla por primera vez, no. La nueva debe tener al menos 8 caracteres y ser distinta
        a la de la cuenta. Equivocarse con la actual gasta los mismos intentos que equivocarse al entrar. Una empresa
        sin acceso responde igual que una que no existe. La contraseña de empresa no sustituye los permisos.
      operationId: setCompanyAccessPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCompanyPasswordRequest'
      responses:
        '204':
          description: Contraseña guardada
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Sin acceso a la empresa (`INSUFFICIENT_PERMISSIONS`), o falta o es incorrecta la contraseña actual
            (`COMPANY_PASSWORD_REQUIRED`, `COMPANY_PASSWORD_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/AccessLocked'
      x-required-permission: accounts.company_accesses.password.set
    delete:
      tags:
      - Accounts
      summary: Quitar la contraseña de una empresa
      description: >-
        Quita la contraseña del acceso. Exige la contraseña de la **cuenta** (`accountPassword`), no la de la empresa:
        es la salida para quien olvidó la de la empresa. Quitar la contraseña de un acceso que no la tiene no cambia
        nada. Equivocarse con la de la cuenta gasta los mismos intentos que equivocarse al entrar.
      operationId: removeCompanyAccessPassword
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveCompanyPasswordRequest'
      responses:
        '204':
          description: Contraseña quitada
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Sin acceso a la empresa (`INSUFFICIENT_PERMISSIONS`), o falta o es incorrecta la contraseña de la cuenta
            (`ACCOUNT_PASSWORD_REQUIRED`, `ACCOUNT_PASSWORD_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/AccessLocked'
      x-required-permission: accounts.company_accesses.password.remove
  /api/v1/accounts/{publicAccountId}/companies:
    parameters:
    - $ref: '#/components/parameters/PublicAccountId'
    - name: publicAccountId
      in: path
      required: true
      description: Identificador público de la cuenta administrativa
      schema:
        type: string
        example: acc_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    get:
      tags:
      - Companies
      summary: Listar empresas visibles de una cuenta
      operationId: listCompanies
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Direction'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Empresas visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-permission: accounts.companies.read
    post:
      tags:
      - Companies
      summary: Crear empresa y sucursal matriz
      operationId: createCompany
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Empresa y matriz creadas en configuración
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
      x-required-permission: companies.create
  /api/v1/companies/{publicCompanyId}:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    get:
      tags:
      - Companies
      summary: Consultar empresa
      operationId: getCompany
      parameters:
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Empresa consultada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-permission: companies.read
    patch:
      tags:
      - Companies
      summary: Actualizar empresa
      operationId: updateCompany
      x-required-permission: companies.update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatchRequest'
      responses:
        '200':
          description: Empresa actualizada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/v1/companies/{publicCompanyId}/branches:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    get:
      tags:
      - Branches
      summary: Listar sucursales visibles
      operationId: listBranches
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Status'
      - name: isHeadOffice
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Direction'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Sucursales visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-permission: branches.read
    post:
      tags:
      - Branches
      summary: Crear sucursal
      operationId: createBranch
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Sucursal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
      x-required-permission: branches.create
  /api/v1/companies/{publicCompanyId}/profile:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    patch:
      tags:
      - Companies
      summary: Actualizar perfil de empresa
      operationId: updateCompanyProfile
      x-required-permission: companies.profile.update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legalName:
                  type: string
                  maxLength: 240
                tradeName:
                  type: string
                  maxLength: 240
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/companies/{publicCompanyId}/tax-profile:
    parameters:
    - $ref: '#/components/parameters/PublicCompanyId'
    - name: publicCompanyId
      in: path
      required: true
      description: Identificador público de la empresa
      schema:
        type: string
        example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
    patch:
      tags:
      - Companies
      summary: Actualizar perfil fiscal
      operationId: updateCompanyTaxProfile
      x-required-permission: companies.tax_profile.update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rfc:
                  type: string
                  maxLength: 13
      responses:
        '200':
          description: Perfil fiscal actualizado
          content:
