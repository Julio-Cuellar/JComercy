asyncapi: 2.6.0
info:
  title: JComercy Company Management Async API
  version: 1.0.0
  description: Especificación de eventos del bus de mensajería, WebSockets y Webhooks
    externos para el módulo Company Management de JComercy.
  contact:
    name: Equipo de Arquitectura JComercy
    email: architecture@jcomercy.com
defaultContentType: application/json
servers:
  eventBus:
    url: rabbitmq.jcomercy.internal:5672
    protocol: amqp
    description: Bus de eventos de integración interno entre módulos de JComercy
  webSockets:
    url: wss://ws.jcomercy.com/ws/v1
    protocol: wss
    description: Conexión WebSocket cifrada para notificaciones y actualizaciones
      en tiempo real
channels:
  events/account/created:
    description: Publicado cuando se crea una cuenta administrativa
    publish:
      operationId: publishAccountCreated
      summary: Publicado cuando se crea una cuenta administrativa
      message:
        $ref: '#/components/messages/AccountCreated'
    subscribe:
      operationId: subscribeAccountCreated
      summary: Suscripción a eventos de tipo account.created
      message:
        $ref: '#/components/messages/AccountCreated'
  events/account/updated:
    description: Publicado cuando se actualizan datos de preferencia o configuración
      de la cuenta
    publish:
      operationId: publishAccountUpdated
      summary: Publicado cuando se actualizan datos de preferencia o configuración
        de la cuenta
      message:
        $ref: '#/components/messages/AccountUpdated'
    subscribe:
      operationId: subscribeAccountUpdated
      summary: Suscripción a eventos de tipo account.updated
      message:
        $ref: '#/components/messages/AccountUpdated'
  events/account/suspended:
    description: Publicado cuando se suspende la cuenta por falta de pago o acción
      administrativa
    publish:
      operationId: publishAccountSuspended
      summary: Publicado cuando se suspende la cuenta por falta de pago o acción administrativa
      message:
        $ref: '#/components/messages/AccountSuspended'
    subscribe:
      operationId: subscribeAccountSuspended
      summary: Suscripción a eventos de tipo account.suspended
      message:
        $ref: '#/components/messages/AccountSuspended'
  events/account/reactivated:
    description: Publicado cuando se reactiva una cuenta suspendida
    publish:
      operationId: publishAccountReactivated
      summary: Publicado cuando se reactiva una cuenta suspendida
      message:
        $ref: '#/components/messages/AccountReactivated'
    subscribe:
      operationId: subscribeAccountReactivated
      summary: Suscripción a eventos de tipo account.reactivated
      message:
        $ref: '#/components/messages/AccountReactivated'
  events/account/deactivated:
    description: Publicado cuando se completa la baja lógica de la cuenta
    publish:
      operationId: publishAccountDeactivated
      summary: Publicado cuando se completa la baja lógica de la cuenta
      message:
        $ref: '#/components/messages/AccountDeactivated'
    subscribe:
      operationId: subscribeAccountDeactivated
      summary: Suscripción a eventos de tipo account.deactivated
      message:
        $ref: '#/components/messages/AccountDeactivated'
  events/company/created:
    description: Publicado cuando se registra una empresa en la cuenta
