  schemas:
    EventEnvelope:
      type: object
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - correlationId
      - accountId
      - companyId
      - data
      properties:
        eventId:
          type: string
          description: 'Identificador único universal del evento (prefix: evt_)'
          example: evt_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        eventType:
          type: string
          description: Nombre canónico del evento en notación punto
          example: company.updated
        eventVersion:
          type: string
          description: Versión del esquema de contrato del evento
          example: '1.0'
        occurredAt:
          type: string
          format: date-time
          description: Fecha y hora de ocurrencia en UTC, ISO 8601
          example: '2026-08-26T20:00:00Z'
        correlationId:
          type: string
          description: Identificador de correlación para trazabilidad de la solicitud
          example: cor_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        causationId:
          type: string
          nullable: true
          description: Identificador del evento u operación causante
          example: cause_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        accountId:
          type: string
          description: Identificador público de la cuenta propietaria
          example: acc_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        companyId:
          type: string
          description: Identificador público de la empresa
          example: com_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        branchId:
          type: string
          nullable: true
          description: Identificador público de la sucursal (opcional si el evento
            es a nivel empresa/cuenta)
          example: brn_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        actorUserId:
          type: string
          nullable: true
          description: Identificador del usuario iniciador (nulo en eventos automáticos
            del sistema o Billing)
          example: usr_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
        data:
          type: object
          description: Payload específico del evento (sin secretos, tokens ni contraseñas)
          additionalProperties: true
    WebSocketSubscribeMessage:
      type: object
      required:
      - action
      - channel
      properties:
        action:
          type: string
          enum:
          - SUBSCRIBE
          - UNSUBSCRIBE
        channel:
          type: string
          example: company.com_01J...notifications
    WebSocketAckMessage:
      type: object
      required:
      - action
      - notificationId
      properties:
        action:
          type: string
          enum:
          - ACK
        notificationId:
          type: string
          example: not_01J8Z9X2Y3W4V5U6T7S8R9Q0P1
  securitySchemes:
    userJwt:
      type: httpApiKey
      name: Authorization
      in: header
      description: JWT de autenticación de usuario 'Bearer {token}'
