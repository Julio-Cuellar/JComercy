# Las pruebas comparten una sola base de datos en memoria, y los contextos de Spring de las clases ya ejecutadas siguen
# vivos con su despachador del Outbox programado cada 5 s. Sin broker, ese despachador se lleva los eventos de la prueba
# en curso y los deja en espera de reintento, y la prueba no los ve salir (ver ERR-002 en documentacion/bitacora.md y
# BIT-040). Se difiere una hora: las pruebas que necesitan despachar lo llaman a mano.
outbox.publisher.fixed-delay-ms=3600000
