# Las pruebas comparten una sola base de datos en memoria, y los contextos de Spring de las clases ya ejecutadas siguen
# vivos con su despachador del Outbox programado cada 5 s. Sin broker, ese despachador se lleva los eventos de la prueba
# en curso y los deja en espera de reintento, y la prueba no los ve salir (ver ERR-002 en documentacion/bitacora.md y
# BIT-040). Se difiere una hora: las pruebas que necesitan despachar lo llaman a mano.
outbox.publisher.fixed-delay-ms=3600000
# También la primera ejecución, que si no ocurre al arrancar cada contexto, en otro hilo, mientras una prueba borra y
# crea eventos: el despachador guarda de vuelta los que ya leyó y resucita las filas borradas (BIT-043).
outbox.publisher.initial-delay-ms=3600000
# Los correos no salen en las pruebas: se guardan en memoria y las pruebas los leen (ERR-029).
jcomercy.mail.mode=recording
jcomercy.public-url=https://app.jcomercy.test
# Las pruebas reenvían invitaciones al instante; la que prueba el límite lo sube por su cuenta.
jcomercy.invitations.resend-min-interval-seconds=0
