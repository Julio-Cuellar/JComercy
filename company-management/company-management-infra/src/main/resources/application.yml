spring:
  application:
    name: company-management
  datasource:
    url: jdbc:h2:mem:company_management_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Con open-in-view cada petición retiene una conexión hasta terminar y las consultas con JdbcTemplate piden otra:
    # con tantas peticiones simultáneas como conexiones tiene el pool, ninguna consigue la segunda (ERR-015).
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: company_management
    locations: classpath:db/migration
  graphql:
    path: /graphql/v1
    schema:
      introspection:
        enabled: false
  # Solo se usa con jcomercy.mail.mode=smtp. El servidor, el usuario y la contraseña se indican con las variables de entorno
  # SPRING_MAIL_HOST, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD (no se escriben aquí: sin host no se crea el cliente de
  # correo, y con mode=smtp eso impide arrancar en vez de fallar al primer correo).
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    # RabbitMQ expone 5673 en el host; 5672 es el puerto interno del contenedor.
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    # Un broker colgado (conexión abierta que no responde) debe notarse en segundos y no en minutos (ERR-021):
    # sin estos tiempos, el cliente tardaba unos 130 s en darla por muerta.
    connection-timeout: 5s
    requested-heartbeat: 10s
    channel-rpc-timeout: 10s

jcomercy:
  # Dirección pública de la aplicación: los enlaces de los correos (recuperar contraseña, activar acceso) apuntan aquí.
  public-url: ${JCOMERCY_PUBLIC_URL:http://localhost:3000}
  mail:
    # disabled: sin servidor de correo, el envío falla a la vista (por defecto).
    # smtp: entrega al servidor de spring.mail.*; sin servidor, el sistema no arranca.
    # recording: guarda los correos en memoria, solo para pruebas y trabajo local; en producción nadie recibiría nada.
    mode: ${JCOMERCY_MAIL_MODE:disabled}
    from: ${JCOMERCY_MAIL_FROM:no-responder@jcomercy.com}

security:
  jwt:
    # Sobrescribir con SECURITY_JWT_SECRET en cualquier entorno no local.
    secret: ${SECURITY_JWT_SECRET:local-only-change-me-012345678901234567890123456789}
    issuer: ${SECURITY_JWT_ISSUER:jcomercy}
    expiration-ms: ${SECURITY_JWT_EXPIRATION_MS:3600000}
graphql:
  security:
    persisted-only: ${GRAPHQL_PERSISTED_ONLY:true}
    max-depth: ${GRAPHQL_MAX_DEPTH:8}
    max-complexity: ${GRAPHQL_MAX_COMPLEXITY:100}
    rate-limit-per-minute: ${GRAPHQL_RATE_LIMIT_PER_MINUTE:60}
    rate-limit-backend: ${GRAPHQL_RATE_LIMIT_BACKEND:memory}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi-company-management-v1.yaml
    disable-swagger-default-url: true
  api-docs:
    enabled: true

outbox:
  publisher:
    fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
  rabbit:
    exchange: ${OUTBOX_RABBIT_EXCHANGE:jcomercy.events}
    staging-queue: ${OUTBOX_RABBIT_STAGING_QUEUE:jcomercy.events.pending}

server:
  port: 8080
