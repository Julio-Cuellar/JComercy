spring:
  application:
    name: company-management
  datasource:
    url: jdbc:h2:mem:company_management_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: company_management
    locations: classpath:db/migration

server:
  port: 8080
