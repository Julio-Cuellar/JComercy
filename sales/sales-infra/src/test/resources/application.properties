# Las pruebas nunca deben hablar con un inventario de verdad: si una prueba llega a llamar a inventario sin su propio
# servidor falso, que se encuentre con un puerto cerrado y falle rápido, en vez de tocar uno que corra en esta máquina.
sales.inventory.base-url=http://127.0.0.1:1
sales.inventory.connect-timeout-ms=500
sales.inventory.read-timeout-ms=500
