name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# El workflow solo lee el código: no necesita permiso de escritura.
permissions:
  contents: read

# Una corrida nueva del mismo PR cancela la anterior, que ya quedó vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # La suite tarda poco más de un minuto con las dependencias en caché; el margen cubre una descarga completa.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Versión de Maven
        run: mvn -v

      - name: Pruebas de todos los módulos
        run: mvn -B -ntp test

      - name: Subir los reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          if-no-files-found: ignore

  # La misma suite, pero sobre un PostgreSQL real en un contenedor (Testcontainers) en lugar de H2. Corre aparte y a la
  # vez que `test`, así que no alarga la corrida. Lo que solo falla en PostgreSQL (tipos, bloqueos, transacciones) no
  # aparece en `test`. Los runners de GitHub traen Docker.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    # Descargar la imagen de PostgreSQL y levantar un contenedor por módulo suma tiempo a la suite de `test`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Versión de Docker
        run: docker version --format 'servidor {{.Server.Version}}'

      - name: Pruebas de todos los módulos sobre PostgreSQL
        run: mvn -B -ntp -Ppostgres test

      - name: Subir los reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-postgres
          path: '**/target/surefire-reports'
          if-no-files-found: ignore

  # La suite sobre PostgreSQL y RabbitMQ reales, ambos en contenedores (Testcontainers). Las pruebas del Outbox contra un
  # broker real se omiten en `test` y en `postgres`, así que sin este job un verde no dice nada sobre el broker: ni que el
  # evento llega a su cola, ni qué pasa con el broker caído o colgado, ni los enlaces de las colas. Usa `-Ppostgres,rabbitmq`
  # porque es la combinación de producción. Las pruebas de broker caído y colgado usan `rabbitmqctl stop_app` y
  # `docker pause` del contenedor; se verificaron en local y en un runner de GitHub se verifican en la primera corrida.
  rabbitmq:
    name: rabbitmq
    runs-on: ubuntu-latest
    # Cada clase con broker real levanta su contenedor (35 a 45 s) y las de broker colgado esperan confirmaciones.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Versión de Docker
        run: docker version --format 'servidor {{.Server.Version}}'

      - name: Pruebas de todos los módulos sobre PostgreSQL y RabbitMQ
        run: mvn -B -ntp -Ppostgres,rabbitmq test

      - name: Subir los reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-rabbitmq
          path: '**/target/surefire-reports'
          if-no-files-found: ignore
