name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# El workflow solo lee el código: no necesita permiso de escritura.
permissions:
  contents: read

# Una corrida nueva del mismo PR cancela la anterior, que ya quedó vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # La suite tarda poco más de un minuto con las dependencias en caché; el margen cubre una descarga completa.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Versión de Maven
        run: mvn -v

      - name: Pruebas de todos los módulos
        run: mvn -B -ntp test

      - name: Subir los reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          if-no-files-found: ignore
