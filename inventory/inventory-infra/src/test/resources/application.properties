# El despachador real del Outbox corre en un hilo propio y compite con las pruebas que
# invocan publishPending() a mano (ver ERR-002 en documentacion/bitacora.md).
outbox.publisher.enabled=false
# Igual que el despachador: las pruebas llaman a expireDue() a mano, sin un planificador compitiendo.
inventory.reservations.expiration.enabled=false
